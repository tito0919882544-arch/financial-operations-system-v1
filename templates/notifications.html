{% extends "base.html" %}{% block page_title %}مركز الإشعارات{% endblock %}{% block content %}<section class="panel"><div class="panel-head"><div><span class="section-kicker">المتابعة</span><h3>مركز الإشعارات</h3></div><form method="post" action="{{ url_for('main.notifications_read_all') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn ghost">تحديد الكل كمقروء</button></form></div>{% for n in rows %}<div class="notification-row {{ n.level }}"><div><strong>{{ n.title }}</strong><p>{{ n.message }}</p><small>{{ n.created_at }}</small></div><div>{% if n.link %}<a class="btn ghost" href="{{ n.link }}">فتح</a>{% endif %}<form method="post" action="{{ url_for('main.notification_read',notification_id=n.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn ghost">مقروء</button></form></div></div>{% else %}<div class="empty">لا توجد إشعارات.</div>{% endfor %}</section>{% endblock %}
