<section class="panel" id="themes">
    <div class="panel-head"><div><span class="section-kicker">الهوية البصرية</span><h3>إدارة التصاميم</h3><p class="muted">تفعيل تصميم موجود أو إنشاء تصميم مخصص. تغيير التصميم لا يغير البيانات المالية.</p></div></div>
    <div class="template-grid">{% for t in themes %}<div class="template-card"><div class="template-preview theme-preview-{{ loop.index }}"><span></span><i></i><b></b></div><div><h4>{{ t.name }}</h4><p>{{ t.description }}</p><small>{% if settings.get('theme')==t.name %}مفعّل الآن{% else %}جاهز للتفعيل{% endif %}</small></div><div class="template-actions"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="save_theme"><input type="hidden" name="theme_id" value="{{ t.id }}"><input type="hidden" name="tab" value="themes"><button class="btn {% if settings.get('theme')==t.name %}primary{% else %}ghost{% endif %}">{{ 'التصميم الحالي' if settings.get('theme')==t.name else 'تفعيل' }}</button></form></div></div>{% endfor %}</div>
    <hr class="soft-divider"><form method="post" class="grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="create_theme"><input type="hidden" name="tab" value="themes"><div><label>اسم تصميم جديد</label><input name="name" required></div><div><label>الوصف</label><input name="description"></div><div class="full-row"><label>CSS مخصص</label><textarea name="css_text"></textarea></div><div class="form-actions full-row"><button class="btn primary">إضافة تصميم</button></div></form>
    <form method="post" style="margin-top:10px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="reset_theme"><input type="hidden" name="tab" value="themes"><button class="btn ghost">إعادة التصميم الافتراضي</button></form>
  </section>
