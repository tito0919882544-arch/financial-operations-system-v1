{% extends "base.html" %}
{% block title %}مركز الصيانة — petty{% endblock %}
{% block page_title %}مركز الصيانة والتشغيل{% endblock %}
{% block content %}
<div class="maintenance-center maintenance-section-page">
{% include 'maintenance_nav.html' %}
{% include 'maintenance_frag_petty.html' %}
<script>(function(){const totalEl=document.getElementById('petty-config-total');function calcPetty(){if(!totalEl)return;let total=0;document.querySelectorAll('[name^="petty_amount_"]').forEach(x=>total+=Number(x.value||0));const n=document.querySelector('[name="new_amount"]');if(n)total+=Number(n.value||0);totalEl.textContent=new Intl.NumberFormat('ar-EG').format(total)}document.querySelectorAll('[name^="petty_amount_"],[name="new_amount"]').forEach(x=>x.addEventListener('input',calcPetty));calcPetty();})();</script>
</div>
{% endblock %}
